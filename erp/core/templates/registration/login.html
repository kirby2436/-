{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="login-box card">
  <div class="login-brand"><span class="sb-mark" aria-hidden="true">E</span><span>건설자재 ERP</span></div>
  <h1>로그인</h1>
  <p class="page-sub">아이디와 비밀번호를 입력하세요.</p>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="field-error">아이디 또는 비밀번호가 올바르지 않습니다. 다시 확인해 주세요.</p>{% endif %}
    <div class="field">
      <label for="{{ form.username.id_for_label }}">아이디</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">비밀번호</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
</div>
{% endblock %}
