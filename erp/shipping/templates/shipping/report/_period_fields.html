<div class="field{% if form.start.errors %} has-error{% endif %}">{{ form.start.label_tag }}{{ form.start }}{% for e in form.start.errors %}<div class="field-error">{{ e }}</div>{% endfor %}</div>
<div class="field{% if form.end.errors %} has-error{% endif %}">{{ form.end.label_tag }}{{ form.end }}{% for e in form.end.errors %}<div class="field-error">{{ e }}</div>{% endfor %}</div>
